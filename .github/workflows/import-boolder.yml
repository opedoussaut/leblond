name: Import Boolder (Fontainebleau)

# Loads Fontainebleau areas, circuits and problems from Boolder's open data
# (https://github.com/boolder-org/boolder-data, © Boolder, CC BY 4.0) into the
# hosted catalogue. Safe to re-run: rows are updated in place and climbers'
# own problems and attempts are never touched.
#
# Run "Deploy database (Supabase)" first so the catalogue tables exist.
# Writes through the database with the same secrets as "Deploy database":
# SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID (SQL batches sent to the
# Supabase Management API, in order; the clean-up batch runs only if every
# upsert succeeded). Prints counts only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "boolder-data branch, tag or commit to import"
        required: false
        default: main
      dry_run:
        description: "Only print what would be imported"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: boolder-org/boolder-data
          ref: ${{ inputs.ref }}
          path: boolder-data
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build SQL batches
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          SHA=$(git -C boolder-data rev-parse HEAD)
          DATE=$(git -C boolder-data log -1 --format=%cI)
          npx tsx scripts/import-boolder.ts --db boolder-data/boolder.db --source-version "$SHA" --source-date "$DATE" --sql-dir "$RUNNER_TEMP/boolder-sql" $DRY_RUN
      - name: Import
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_ID" ]] || { echo "SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID missing"; exit 1; }
          for f in "$RUNNER_TEMP"/boolder-sql/*.sql; do
            jq -n --rawfile q "$f" '{query: $q}' > "$RUNNER_TEMP/body.json"
            code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json"               --data-binary "@$RUNNER_TEMP/body.json"               "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query")
            if [[ "$code" != 2* ]]; then echo "batch $(basename "$f") failed: HTTP $code"; head -c 400 "$RUNNER_TEMP/out.json"; echo; exit 1; fi
            echo "batch $(basename "$f") ok"
          done
          echo "── catalogue now ──"
          cat "$RUNNER_TEMP/out.json"; echo
